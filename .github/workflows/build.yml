name: Build

# Builds and tests every push and pull request. A pushed version tag (v1.0.6) also creates the
# GitHub release with the zip and its SHA-256 (see .github/scripts/release.sh).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # creating releases

env:
  # The engine version this plugin compiles against: keep equal to oie.version in pom.xml.
  OIE_VERSION: 4.6.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-oie${{ env.OIE_VERSION }}-${{ hashFiles('pom.xml') }}
          restore-keys: maven-oie${{ env.OIE_VERSION }}-

      - name: Install the OIE engine jars
        run: |
          if [ -f ~/.m2/repository/com/mirth/connect/client-core/${OIE_VERSION}/client-core-${OIE_VERSION}.jar ]; then
            echo "Engine jars ${OIE_VERSION} restored from the cache"
          else
            bash .github/scripts/install-oie-jars.sh "${OIE_VERSION}"
          fi

      - name: Check versions
        run: bash .github/scripts/check-versions.sh "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}"

      - name: Build and test
        run: mvn -B package

      - name: Keep the zip
        uses: actions/upload-artifact@v4
        with:
          name: datatype-gdt
          path: target/datatype-gdt-*.zip

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release.sh "${{ github.ref_name }}"

  # Releases created above with GITHUB_TOKEN do not fire `release`, so call the catalog workflow here.
  catalog:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/catalog-pr.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      CATALOG_TOKEN: ${{ secrets.CATALOG_TOKEN }}
